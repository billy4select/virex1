<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="第 01 章核心：Google 處理每一個網頁的四道關卡">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">第 01 章核心：Google 處理每一個網頁的四道關卡</text>
  
      <rect x="36" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="52" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">第 1 關</text>
      <text x="52" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">探索與爬取</text>
      <text x="52" y="190" class="font" fill="#52525B" font-size="12.5">透過 Sitemap 與內鏈找到網址並抓回內容</text>
    
      <rect x="266" y="92" width="198" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="282" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">第 2 關</text>
      <text x="282" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">建立索引</text>
      <text x="282" y="190" class="font" fill="#52525B" font-size="12.5">評估增量價值與重複度，決定要不要收錄</text>
    
      <rect x="496" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="512" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">第 3 關</text>
      <text x="512" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">演算法排序</text>
      <text x="512" y="190" class="font" fill="#52525B" font-size="12.5">比對搜尋意圖、內容深度與全站主題權威</text>
    
      <rect x="726" y="92" width="198" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="742" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">第 4 關</text>
      <text x="742" y="156" class="font" fill="#FFFFFF" font-size="16" font-weight="800">搜尋頁呈現</text>
      <text x="742" y="190" class="font" fill="#D4D4D8" font-size="12.5">標題、摘要與 FAQ 決定搜尋者願不願點你</text>
    
</svg>