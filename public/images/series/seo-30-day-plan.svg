<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="第 07 章核心：SEO 起步 30 天計畫（四週節奏）">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">第 07 章核心：SEO 起步 30 天計畫（四週節奏）</text>
  
      <rect x="36" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="52" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">第 1 週</text>
      <text x="52" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">裝好 GSC＋清技術</text>
      <text x="52" y="190" class="font" fill="#52525B" font-size="12.5">提交 Sitemap、檢查既有頁面收錄與轉址</text>
    
      <rect x="266" y="92" width="198" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="282" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">第 2 週</text>
      <text x="282" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">規劃 1 個主題集群</text>
      <text x="282" y="190" class="font" fill="#52525B" font-size="12.5">挑 1 個核心主題，列出 5–8 篇不撞題選題</text>
    
      <rect x="496" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="512" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">第 3 週</text>
      <text x="512" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">寫完前 3 篇主力文</text>
      <text x="512" y="190" class="font" fill="#52525B" font-size="12.5">對齊搜尋意圖、補上圖表、FAQ 與官方來源</text>
    
      <rect x="726" y="92" width="198" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="742" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">第 4 週</text>
      <text x="742" y="156" class="font" fill="#FFFFFF" font-size="16" font-weight="800">補齊內鏈＋設基準</text>
      <text x="742" y="190" class="font" fill="#D4D4D8" font-size="12.5">新舊文互相連通，記下基線等 4–8 週看曝光</text>
    
