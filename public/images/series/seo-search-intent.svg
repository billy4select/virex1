<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="第 02 章核心：先看搜尋者要完成什麼任務，再動筆寫">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">第 02 章核心：先看搜尋者要完成什麼任務，再動筆寫</text>
  
      <rect x="36" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="52" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">資訊型</text>
      <text x="52" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">找定義與教學</text>
      <text x="52" y="190" class="font" fill="#52525B" font-size="12.5">直接給白話解釋、步驟與圖解</text>
    
      <rect x="266" y="92" width="198" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="282" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">商業調查型</text>
      <text x="282" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">比較與評測</text>
      <text x="282" y="190" class="font" fill="#52525B" font-size="12.5">給比較表、適用對象與真實踩雷</text>
    
      <rect x="496" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="512" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">交易型</text>
      <text x="512" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">準備付費購買</text>
      <text x="512" y="190" class="font" fill="#52525B" font-size="12.5">給方案價格、常見疑問與清楚入口</text>
    
      <rect x="726" y="92" width="198" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="742" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">導覽型</text>
      <text x="742" y="156" class="font" fill="#FFFFFF" font-size="16" font-weight="800">找特定品牌頁</text>
      <text x="742" y="190" class="font" fill="#D4D4D8" font-size="12.5">讓品牌名稱與官網結構清楚好認</text>
    
</svg>