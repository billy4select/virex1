<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="第 02 章核心：業績掉了別亂改，照這四段找真正斷點">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">第 02 章核心：業績掉了別亂改，照這四段找真正斷點</text>
  
      <rect x="36" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="52" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">第 1 段</text>
      <text x="52" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">流量（進站）</text>
      <text x="52" y="190" class="font" fill="#52525B" font-size="12.5">進來的人變少，還是來的根本不對人？</text>
    
      <rect x="266" y="92" width="198" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="282" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">第 2 段</text>
      <text x="282" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">轉換（下單）</text>
      <text x="282" y="190" class="font" fill="#52525B" font-size="12.5">人進來了卻跳出，是首屏還是信任斷點？</text>
    
      <rect x="496" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="512" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">第 3 段</text>
      <text x="512" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">客單價</text>
      <text x="512" y="190" class="font" fill="#52525B" font-size="12.5">單筆毛利夠不夠撐住廣告與營運成本？</text>
    
      <rect x="726" y="92" width="198" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="742" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">第 4 段</text>
      <text x="742" y="156" class="font" fill="#FFFFFF" font-size="16" font-weight="800">回購率</text>
      <text x="742" y="190" class="font" fill="#D4D4D8" font-size="12.5">老客有沒有回來，還是永遠靠砸錢買新客？</text>
    
</svg>