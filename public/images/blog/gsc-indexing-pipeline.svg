<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="gsc-pipe-title gsc-pipe-desc">
  <title id="gsc-pipe-title">Google 網頁收錄三關卡與卡點對照圖</title>
  <desc id="gsc-pipe-desc">從探索、檢索到建立索引與成效拉流量的四階段流程，標示已探索未建立索引與已檢索未建立索引的卡關位置。</desc>
  <defs>
    <style>
      .bg { fill: #FFFBF5; }
      .ink { fill: #18181B; }
      .muted { fill: #52525B; }
      .orange { fill: #EA580C; }
      .amber { fill: #FBBF24; }
      .card { fill: #FFFFFF; stroke: #18181B; stroke-width: 2; }
      .card-hi { fill: #FFF3EB; stroke: #EA580C; stroke-width: 2.5; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181B" />
    </marker>
  </defs>

  <rect class="bg" width="960" height="360" rx="14" />

  <!-- Top editorial header -->
  <rect x="36" y="28" width="6" height="26" rx="2" class="orange" />
  <text x="52" y="48" class="font-sans ink" font-size="18" font-weight="800">Google 收錄三關卡：你的文章卡在哪一步？</text>
  <text x="924" y="47" text-anchor="end" class="font-sans muted" font-size="12" font-weight="600">GSC 診斷邏輯圖</text>

  <!-- Step 1 -->
  <rect x="36" y="88" width="196" height="120" rx="10" class="card" />
  <rect x="52" y="102" width="54" height="22" rx="11" fill="#18181B" />
  <text x="79" y="117" text-anchor="middle" class="font-sans" fill="#FFFFFF" font-size="11" font-weight="700">第 1 關</text>
  <text x="52" y="152" class="font-sans ink" font-size="18" font-weight="800">探索（找到網址）</text>
  <text x="52" y="176" class="font-sans muted" font-size="12.5">透過 Sitemap 與站內連結</text>
  <text x="52" y="194" class="font-sans muted" font-size="12.5">知道這頁存在</text>

  <!-- Arrow 1->2 -->
  <line x1="232" y1="148" x2="266" y2="148" stroke="#18181B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2 -->
  <rect x="272" y="88" width="196" height="120" rx="10" class="card-hi" />
  <rect x="288" y="102" width="54" height="22" rx="11" class="orange" />
  <text x="315" y="117" text-anchor="middle" class="font-sans" fill="#FFFFFF" font-size="11" font-weight="700">第 2 關</text>
  <text x="288" y="152" class="font-sans ink" font-size="18" font-weight="800">檢索（讀完內容）</text>
  <text x="288" y="176" class="font-sans muted" font-size="12.5">Googlebot 實際抓回網頁</text>
  <text x="288" y="194" class="font-sans muted" font-size="12.5">評估內容與重複度</text>

  <!-- Arrow 2->3 -->
  <line x1="468" y1="148" x2="502" y2="148" stroke="#18181B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3 -->
  <rect x="508" y="88" width="196" height="120" rx="10" class="card" />
  <rect x="524" y="102" width="54" height="22" rx="11" fill="#18181B" />
  <text x="551" y="117" text-anchor="middle" class="font-sans" fill="#FFFFFF" font-size="11" font-weight="700">第 3 關</text>
  <text x="524" y="152" class="font-sans ink" font-size="18" font-weight="800">建立索引（收錄）</text>
  <text x="524" y="176" class="font-sans muted" font-size="12.5">正式放進搜尋資料庫</text>
  <text x="524" y="194" class="font-sans muted" font-size="12.5">拿到參與排名的入場券</text>

  <!-- Arrow 3->4 -->
  <line x1="704" y1="148" x2="738" y2="148" stroke="#18181B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 4 -->
  <rect x="744" y="88" width="180" height="120" rx="10" fill="#18181B" />
  <rect x="760" y="102" width="60" height="22" rx="11" class="amber" />
  <text x="790" y="117" text-anchor="middle" class="font-sans ink" font-size="11" font-weight="800">下半場</text>
  <text x="760" y="152" class="font-sans" fill="#FFFFFF" font-size="18" font-weight="800">成效拉流量</text>
  <text x="760" y="176" class="font-sans" fill="#D4D4D8" font-size="12.5">撈出第 8–20 名潛力詞</text>
  <text x="760" y="194" class="font-sans" fill="#D4D4D8" font-size="12.5">改標題與段落衝首頁</text>

  <!-- Bottom callouts showing where pages get stuck -->
  <line x1="134" y1="208" x2="134" y2="246" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="4 3" />
  <rect x="36" y="246" width="210" height="82" rx="8" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5" />
  <text x="50" y="270" class="font-sans ink" font-size="13" font-weight="800">卡在這裡：已探索未建立索引</text>
  <text x="50" y="292" class="font-sans muted" font-size="12">爬蟲還沒來讀內容</text>
  <text x="50" y="311" class="font-sans orange" font-size="12" font-weight="700">→ 補高權重舊文內鏈＋查主機速度</text>

  <line x1="370" y1="208" x2="370" y2="246" stroke="#EA580C" stroke-width="2" stroke-dasharray="4 3" />
  <rect x="266" y="246" width="320" height="82" rx="8" fill="#FFF3EB" stroke="#EA580C" stroke-width="1.8" />
  <text x="282" y="270" class="font-sans orange" font-size="13" font-weight="800">最常卡關：已檢索，目前未建立索引</text>
  <text x="282" y="292" class="font-sans ink" font-size="12">讀完了但認為增量價值不足，或撞題／孤島頁</text>
  <text x="282" y="311" class="font-sans orange" font-size="12" font-weight="700">→ 消滅孤島頁＋整併重複文＋補齊實戰深度</text>

  <line x1="606" y1="208" x2="606" y2="246" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="4 3" />
  <rect x="606" y="246" width="318" height="82" rx="8" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5" />
  <text x="622" y="270" class="font-sans ink" font-size="13" font-weight="800">已建立索引卻沒流量？</text>
  <text x="622" y="292" class="font-sans muted" font-size="12">收錄不等於進首頁，多半卡在第 2 頁</text>
  <text x="622" y="311" class="font-sans ink" font-size="12" font-weight="700">→ 等 2–4 週進 GSC 成效報表跑第二階段優化</text>
</svg>
