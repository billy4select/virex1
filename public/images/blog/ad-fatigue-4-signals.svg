<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="廣告疲勞四個訊號與素材輪替節奏">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">看到這 4 個訊號代表進入廣告疲勞：該換的是「切角」，不是背景色</text>
  
    <rect x="36" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
    <text x="54" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">訊號 1</text>
    <text x="54" y="156" class="font" fill="#18181B" font-size="16.5" font-weight="800">頻次飆破 3–4</text>
    <text x="54" y="190" class="font" fill="#52525B" font-size="12.5">同一群人短時間看太多次</text>
  
    <rect x="266" y="92" width="198" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
    <text x="284" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">訊號 2</text>
    <text x="284" y="156" class="font" fill="#18181B" font-size="16.5" font-weight="800">CTR 連續下滑</text>
    <text x="284" y="190" class="font" fill="#52525B" font-size="12.5">滑過去直接無視不再點擊</text>
  
    <rect x="496" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
    <text x="514" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">訊號 3</text>
    <text x="514" y="156" class="font" fill="#18181B" font-size="16.5" font-weight="800">CPM 莫名變貴</text>
    <text x="514" y="190" class="font" fill="#52525B" font-size="12.5">互動變差被系統調高出價</text>
  
    <rect x="726" y="92" width="198" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
    <text x="744" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">訊號 4</text>
    <text x="744" y="156" class="font" fill="#FFFFFF" font-size="16.5" font-weight="800">CPA 逐漸墊高</text>
    <text x="744" y="190" class="font" fill="#D4D4D8" font-size="12.5">買到同一單花的錢變多</text>
  
</svg>