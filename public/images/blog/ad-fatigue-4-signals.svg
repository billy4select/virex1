<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="廣告疲勞四個訊號與素材輪替節奏">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="520" rx="16" fill="#FFFBF5"/>
  <rect x="36" y="34" width="7" height="32" rx="2" fill="#EA580C"/>
  <text x="56" y="58" class="font" fill="#18181B" font-size="21" font-weight="800">看到這 4 個訊號代表進入廣告疲勞：該換的是「切角」，不是背景色</text>
  
      <rect x="36" y="108" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">訊號 1</text>
      <text x="64" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">頻次飆破 3–4</text>
      <text x="64" y="232" class="font" fill="#52525B" font-size="15.5">同一群人短時間看太多次</text>

      <rect x="494" y="108" width="430" height="174" rx="14" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="522" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">訊號 2</text>
      <text x="522" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">CTR 連續下滑</text>
      <text x="522" y="232" class="font" fill="#52525B" font-size="15.5">滑過去直接無視不再點擊</text>

      <rect x="36" y="306" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="346" class="font" fill="#EA580C" font-size="13.5" font-weight="800">訊號 3</text>
      <text x="64" y="384" class="font" fill="#18181B" font-size="20" font-weight="800">CPM 莫名變貴</text>
      <text x="64" y="430" class="font" fill="#52525B" font-size="15.5">互動變差被系統調高出價</text>

      <rect x="494" y="306" width="430" height="174" rx="14" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="522" y="346" class="font" fill="#FBBF24" font-size="13.5" font-weight="800">訊號 4</text>
      <text x="522" y="384" class="font" fill="#FFFFFF" font-size="20" font-weight="800">CPA 逐漸墊高</text>
      <text x="522" y="430" class="font" fill="#D4D4D8" font-size="15.5">買到同一單花的錢變多</text>
</svg>
