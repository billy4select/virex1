<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="四種搜尋意圖與對應頁面形式對照圖">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="300" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">4 種搜尋意圖：先看搜尋者「想完成什麼事」，再決定文章格式</text>
  
    <rect x="36" y="92" width="198" height="170" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
    <rect x="52" y="110" width="76" height="22" rx="11" fill="#18181B"/>
    <text x="90" y="125" text-anchor="middle" class="font" fill="#FFFFFF" font-size="11" font-weight="800">資訊型</text>
    <text x="52" y="162" class="font" fill="#18181B" font-size="13.5" font-weight="800">「GA4 跳出率怎麼算」</text>
    <text x="52" y="196" class="font" fill="#52525B" font-size="12">建議頁面形式：</text>
    <text x="52" y="220" class="font" fill="#EA580C" font-size="12.5" font-weight="700">教學文、步驟指南、圖解</text>
  
    <rect x="266" y="92" width="198" height="170" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
    <rect x="282" y="110" width="76" height="22" rx="11" fill="#EA580C"/>
    <text x="320" y="125" text-anchor="middle" class="font" fill="#FFFFFF" font-size="11" font-weight="800">商業調查型</text>
    <text x="282" y="162" class="font" fill="#18181B" font-size="13.5" font-weight="800">「Claude vs ChatGPT」</text>
    <text x="282" y="196" class="font" fill="#52525B" font-size="12">建議頁面形式：</text>
    <text x="282" y="220" class="font" fill="#EA580C" font-size="12.5" font-weight="700">比較表、實測評測、選型基準</text>
  
    <rect x="496" y="92" width="198" height="170" rx="12" fill="#FDE68A" stroke="#18181B" stroke-width="2.2"/>
    <rect x="512" y="110" width="76" height="22" rx="11" fill="#18181B"/>
    <text x="550" y="125" text-anchor="middle" class="font" fill="#FFFFFF" font-size="11" font-weight="800">交易型</text>
    <text x="512" y="162" class="font" fill="#18181B" font-size="13.5" font-weight="800">「Google AI Pro 訂閱」</text>
    <text x="512" y="196" class="font" fill="#52525B" font-size="12">建議頁面形式：</text>
    <text x="512" y="220" class="font" fill="#EA580C" font-size="12.5" font-weight="700">方案頁、價格比較、購買路徑</text>
  
    <rect x="726" y="92" width="198" height="170" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
    <rect x="742" y="110" width="76" height="22" rx="11" fill="#FBBF24"/>
    <text x="780" y="125" text-anchor="middle" class="font" fill="#18181B" font-size="11" font-weight="800">導覽型</text>
    <text x="742" y="162" class="font" fill="#FFFFFF" font-size="13.5" font-weight="800">「比利陳 官網」</text>
    <text x="742" y="196" class="font" fill="#D4D4D8" font-size="12">建議頁面形式：</text>
    <text x="742" y="220" class="font" fill="#FBBF24" font-size="12.5" font-weight="700">首頁、品牌關於頁、登入入口</text>
  
</svg>