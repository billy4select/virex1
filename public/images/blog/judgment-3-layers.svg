<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="AI 越會給答案，這三層「人類判斷力」反而越值錢">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#18181B"/></marker></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">AI 越會給答案，這三層「人類判斷力」反而越值錢</text>
  
      <rect x="36" y="92" width="264" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="56" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">第一層</text>
      <text x="56" y="156" class="font" fill="#18181B" font-size="16.5" font-weight="800">問題有沒有問對？</text>
      <text x="56" y="190" class="font" fill="#52525B" font-size="12.5">避開「用超快速度解一個根本不該解的題」</text>
      <line x1="300" y1="167" x2="338" y2="167" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>
    
      <rect x="348" y="92" width="264" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="368" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">第二層</text>
      <text x="368" y="156" class="font" fill="#18181B" font-size="16.5" font-weight="800">證據夠不夠支撐？</text>
      <text x="368" y="190" class="font" fill="#52525B" font-size="12.5">檢查樣本、前提與來源，不被流暢語氣騙過</text>
      <line x1="612" y1="167" x2="650" y2="167" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>
    
      <rect x="660" y="92" width="264" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="680" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">第三層</text>
      <text x="680" y="156" class="font" fill="#FFFFFF" font-size="16.5" font-weight="800">執行後果誰承擔？</text>
      <text x="680" y="190" class="font" fill="#D4D4D8" font-size="12.5">衡量對客戶信任、團隊士氣與損益的真實影響</text>
      
    
</svg>