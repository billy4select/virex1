<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="重複做十次不叫練習：知識工作者的刻意練習四步迴路">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">重複做十次不叫練習：知識工作者的刻意練習四步迴路</text>
  
      <rect x="36" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="52" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">01 拆細</text>
      <text x="52" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">拆成單一子技能</text>
      <text x="52" y="190" class="font" fill="#52525B" font-size="12.5">例如只練「開頭破題」或「拆問題」</text>
    
      <rect x="266" y="92" width="198" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="282" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">02 專練</text>
      <text x="282" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">20 分鐘高專注練習</text>
      <text x="282" y="190" class="font" fill="#52525B" font-size="12.5">針對最弱環節刻意練，不偏食</text>
    
      <rect x="496" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="512" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">03 回饋</text>
      <text x="512" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">取得外部具體修正</text>
      <text x="512" y="190" class="font" fill="#52525B" font-size="12.5">找同行、主管或真實市場看結果</text>
    
      <rect x="726" y="92" width="198" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="742" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">04 留版</text>
      <text x="742" y="156" class="font" fill="#FFFFFF" font-size="16" font-weight="800">保留前後改版對照</text>
      <text x="742" y="190" class="font" fill="#D4D4D8" font-size="12.5">看見進步曲線，同時累積作品集</text>
    
</svg>