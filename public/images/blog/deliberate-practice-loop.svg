<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="重複做十次不叫練習：知識工作者的刻意練習四步迴路">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="520" rx="16" fill="#FFFBF5"/>
  <rect x="36" y="34" width="7" height="32" rx="2" fill="#EA580C"/>
  <text x="56" y="58" class="font" fill="#18181B" font-size="21" font-weight="800">重複做十次不叫練習：知識工作者的刻意練習四步迴路</text>
  
      <rect x="36" y="108" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">01 拆細</text>
      <text x="64" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">拆成單一子技能</text>
      <text x="64" y="232" class="font" fill="#52525B" font-size="15.5">例如只練「開頭破題」或「拆問題」</text>

      <rect x="494" y="108" width="430" height="174" rx="14" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="522" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">02 專練</text>
      <text x="522" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">20 分鐘高專注練習</text>
      <text x="522" y="232" class="font" fill="#52525B" font-size="15.5">針對最弱環節刻意練，不偏食</text>

      <rect x="36" y="306" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="346" class="font" fill="#EA580C" font-size="13.5" font-weight="800">03 回饋</text>
      <text x="64" y="384" class="font" fill="#18181B" font-size="20" font-weight="800">取得外部具體修正</text>
      <text x="64" y="430" class="font" fill="#52525B" font-size="15.5">找同行、主管或真實市場看結果</text>

      <rect x="494" y="306" width="430" height="174" rx="14" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="522" y="346" class="font" fill="#FBBF24" font-size="13.5" font-weight="800">04 留版</text>
      <text x="522" y="384" class="font" fill="#FFFFFF" font-size="20" font-weight="800">保留前後改版對照</text>
      <text x="522" y="430" class="font" fill="#D4D4D8" font-size="15.5">看見進步曲線，同時累積作品集</text>
</svg>
