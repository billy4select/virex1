<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="網站速度不用追 100 分：先看懂 Core Web Vitals 這三個綠燈門檻">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#18181B"/></marker></defs>
  <rect width="960" height="480" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="60" width="6" height="29.9" rx="2" fill="#EA580C"/>
  <text x="52" y="82.3" class="font" fill="#18181B" font-size="18" font-weight="800">網站速度不用追 100 分：先看懂 Core Web Vitals 這三個綠燈門檻</text>
  
      <rect x="36" y="157.7" width="264" height="257.1" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="56" y="212.6" class="font" fill="#EA580C" font-size="12" font-weight="800">LCP（載入）</text>
      <text x="56" y="267.4" class="font" fill="#18181B" font-size="16.5" font-weight="800">首屏主內容 ≤ 2.5 秒</text>
      <text x="56" y="325.7" class="font" fill="#52525B" font-size="12.5">壓縮首圖轉 WebP、清掉過重字型與外掛</text>
      <line x1="300" y1="286.3" x2="338" y2="286.3" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>
    
      <rect x="348" y="157.7" width="264" height="257.1" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="368" y="212.6" class="font" fill="#EA580C" font-size="12" font-weight="800">INP（互動）</text>
      <text x="368" y="267.4" class="font" fill="#18181B" font-size="16.5" font-weight="800">點擊反應 ≤ 200 毫秒</text>
      <text x="368" y="325.7" class="font" fill="#52525B" font-size="12.5">減少無用追蹤碼與阻塞主執行緒的腳本</text>
      <line x1="612" y1="286.3" x2="650" y2="286.3" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>
    
      <rect x="660" y="157.7" width="264" height="257.1" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="680" y="212.6" class="font" fill="#FBBF24" font-size="12" font-weight="800">CLS（穩定）</text>
      <text x="680" y="267.4" class="font" fill="#FFFFFF" font-size="16.5" font-weight="800">畫面位移 ≤ 0.1</text>
      <text x="680" y="325.7" class="font" fill="#D4D4D8" font-size="12.5">圖片與廣告區塊先固定寬高，別讓排版亂跳</text>
      
    
</svg>