<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="業績預估別再拍腦袋：4 種方法怎麼挑？（實務用「上下對撞」最準）">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="520" rx="16" fill="#FFFBF5"/>
  <rect x="36" y="34" width="7" height="32" rx="2" fill="#EA580C"/>
  <text x="56" y="58" class="font" fill="#18181B" font-size="21" font-weight="800">業績預估別再拍腦袋：4 種方法怎麼挑？（實務用「上下對撞」最準）</text>
  
      <rect x="36" y="108" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">方法 1</text>
      <text x="64" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">由上而下法</text>
      <text x="64" y="232" class="font" fill="#52525B" font-size="15.5">看市場總量×市佔，適合新品抓天花板</text>

      <rect x="494" y="108" width="430" height="174" rx="14" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="522" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">方法 2</text>
      <text x="522" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">由下而上法</text>
      <text x="522" y="232" class="font" fill="#52525B" font-size="15.5">看業務產能×成交率，適合對團隊交代執行</text>

      <rect x="36" y="306" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="346" class="font" fill="#EA580C" font-size="13.5" font-weight="800">方法 3</text>
      <text x="64" y="384" class="font" fill="#18181B" font-size="20" font-weight="800">銷售漏斗法</text>
      <text x="64" y="430" class="font" fill="#52525B" font-size="15.5">流量×轉換率×客單價，電商與廣告最常用</text>

      <rect x="494" y="306" width="430" height="174" rx="14" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="522" y="346" class="font" fill="#FBBF24" font-size="13.5" font-weight="800">方法 4</text>
      <text x="522" y="384" class="font" fill="#FFFFFF" font-size="20" font-weight="800">歷史成長法</text>
      <text x="522" y="430" class="font" fill="#D4D4D8" font-size="15.5">看兩年以上同月趨勢，避開淡旺季誤判</text>
</svg>
