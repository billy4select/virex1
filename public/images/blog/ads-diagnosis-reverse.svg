<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="廣告沒效果從轉換率倒查三步驟圖">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#18181B"/></marker></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">廣告沒效別急著換受眾：從最靠近成交的地方往回查</text>
  
    <rect x="36" y="92" width="264" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
    <text x="56" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">先查 1</text>
    <text x="56" y="158" class="font" fill="#18181B" font-size="17" font-weight="800">轉換率（CVR）</text>
    <text x="56" y="192" class="font" fill="#52525B" font-size="13">進站到底有沒有加購／留單？</text>
    <line x1="300" y1="167" x2="338" y2="167" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>
  
    <rect x="348" y="92" width="264" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
    <text x="368" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">再查 2</text>
    <text x="368" y="158" class="font" fill="#18181B" font-size="17" font-weight="800">GA4 跳出率與速度</text>
    <text x="368" y="192" class="font" fill="#52525B" font-size="13">手機開太慢還是首屏接不住？</text>
    <line x1="612" y1="167" x2="650" y2="167" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>
  
    <rect x="660" y="92" width="264" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
    <text x="680" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">最後查 3</text>
    <text x="680" y="158" class="font" fill="#FFFFFF" font-size="17" font-weight="800">CTR 與商品力</text>
    <text x="680" y="192" class="font" fill="#D4D4D8" font-size="13">換素材切角，或誠實檢視定價</text>
    
  
</svg>