<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="部落格與 Threads 導流至 Substack 電子報漏斗圖">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#18181B"/></marker></defs>
  <rect width="960" height="520" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="57.5" width="6" height="29.9" rx="2" fill="#EA580C"/>
  <text x="52" y="78" class="font" fill="#18181B" font-size="18" font-weight="800">一魚三吃導流線：把公域流量接進握在自己手上的 Substack 名單池</text>

  <rect x="36" y="149.5" width="268" height="299" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
  <rect x="54" y="178.8" width="88" height="25.3" rx="11" fill="#18181B"/>
  <text x="98" y="203.1" text-anchor="middle" class="font" fill="#FFFFFF" font-size="11" font-weight="700">長尾搜尋層</text>
  <text x="54" y="260" class="font" fill="#18181B" font-size="17" font-weight="800">自有官網長文（SEO）</text>
  <text x="54" y="305.5" class="font" fill="#52525B" font-size="13">寫透單一痛點與實測步驟</text>
  <text x="54" y="341.3" class="font" fill="#52525B" font-size="13">頁尾固定放置電子報入口</text>
  <text x="54" y="399.8" class="font" fill="#EA580C" font-size="12.5" font-weight="700">→ 信任度最高、轉訂閱最穩</text>

  <line x1="304" y1="299" x2="342" y2="299" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>

  <rect x="348" y="149.5" width="268" height="299" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
  <rect x="366" y="178.8" width="88" height="25.3" rx="11" fill="#EA580C"/>
  <text x="410" y="203.1" text-anchor="middle" class="font" fill="#FFFFFF" font-size="11" font-weight="700">公域擴散層</text>
  <text x="366" y="260" class="font" fill="#18181B" font-size="17" font-weight="800">Threads ／ Notes 拆文</text>
  <text x="366" y="305.5" class="font" fill="#52525B" font-size="13">抽一個反差盲點寫成 5–8 行短文</text>
  <text x="366" y="341.3" class="font" fill="#52525B" font-size="13">主文講完觀點、留言區補連結</text>
  <text x="366" y="399.8" class="font" fill="#EA580C" font-size="12.5" font-weight="700">→ 避免主文放連結被壓觸及</text>

  <line x1="616" y1="299" x2="654" y2="299" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>

  <rect x="660" y="149.5" width="264" height="299" rx="12" fill="#18181B"/>
  <rect x="678" y="178.8" width="88" height="25.3" rx="11" fill="#FBBF24"/>
  <text x="722" y="203.1" text-anchor="middle" class="font" fill="#18181B" font-size="11" font-weight="800">私域留存層</text>
  <text x="678" y="260" class="font" fill="#FFFFFF" font-size="17" font-weight="800">Substack 電子報名單</text>
  <text x="678" y="305.5" class="font" fill="#D4D4D8" font-size="13">繁中介面＋零平台月費門檻</text>
  <text x="678" y="341.3" class="font" fill="#D4D4D8" font-size="13">定期寄出深度觀點＋每季備份 CSV</text>
  <text x="678" y="399.8" class="font" fill="#FBBF24" font-size="12.5" font-weight="700">→ 不受演算法綁架的自有資產</text>
</svg>