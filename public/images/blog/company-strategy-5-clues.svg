<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="不用先啃百頁財報：從這 4 個公開線索就能看懂對手的商業盤算">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="520" rx="16" fill="#FFFBF5"/>
  <rect x="36" y="34" width="7" height="32" rx="2" fill="#EA580C"/>
  <text x="56" y="58" class="font" fill="#18181B" font-size="21" font-weight="800">不用先啃百頁財報：從這 4 個公開線索就能看懂對手的商業盤算</text>
  
      <rect x="36" y="108" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">線索 1</text>
      <text x="64" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">官網定價與方案</text>
      <text x="64" y="232" class="font" fill="#52525B" font-size="15.5">看它主推哪一階、靠什麼品項當獲利引擎</text>

      <rect x="494" y="108" width="430" height="174" rx="14" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="522" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">線索 2</text>
      <text x="522" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">職缺與徵才方向</text>
      <text x="522" y="232" class="font" fill="#52525B" font-size="15.5">公司把錢跟人往哪投，就是明年真正的戰場</text>

      <rect x="36" y="306" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="346" class="font" fill="#EA580C" font-size="13.5" font-weight="800">線索 3</text>
      <text x="64" y="384" class="font" fill="#18181B" font-size="20" font-weight="800">廣告素材與負評</text>
      <text x="64" y="430" class="font" fill="#52525B" font-size="15.5">看它怎麼切痛點，以及現有客戶最抱怨哪裡</text>

      <rect x="494" y="306" width="430" height="174" rx="14" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="522" y="346" class="font" fill="#FBBF24" font-size="13.5" font-weight="800">線索 4</text>
      <text x="522" y="384" class="font" fill="#FFFFFF" font-size="20" font-weight="800">再回頭對照數字</text>
      <text x="522" y="430" class="font" fill="#D4D4D8" font-size="15.5">用營收、毛利與法說會驗證你的策略推論</text>
</svg>
