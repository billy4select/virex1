<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="不用先啃百頁財報：從這 4 個公開線索就能看懂對手的商業盤算">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">不用先啃百頁財報：從這 4 個公開線索就能看懂對手的商業盤算</text>
  
      <rect x="36" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="52" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">線索 1</text>
      <text x="52" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">官網定價與方案</text>
      <text x="52" y="190" class="font" fill="#52525B" font-size="12.5">看它主推哪一階、靠什麼品項當獲利引擎</text>
    
      <rect x="266" y="92" width="198" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="282" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">線索 2</text>
      <text x="282" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">職缺與徵才方向</text>
      <text x="282" y="190" class="font" fill="#52525B" font-size="12.5">公司把錢跟人往哪投，就是明年真正的戰場</text>
    
      <rect x="496" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="512" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">線索 3</text>
      <text x="512" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">廣告素材與負評</text>
      <text x="512" y="190" class="font" fill="#52525B" font-size="12.5">看它怎麼切痛點，以及現有客戶最抱怨哪裡</text>
    
      <rect x="726" y="92" width="198" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="742" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">線索 4</text>
      <text x="742" y="156" class="font" fill="#FFFFFF" font-size="16" font-weight="800">再回頭對照數字</text>
      <text x="742" y="190" class="font" fill="#D4D4D8" font-size="12.5">用營收、毛利與法說會驗證你的策略推論</text>
    
</svg>