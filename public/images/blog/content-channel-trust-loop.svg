    <text x="56" y="190" class="font" fill="#52525B" font-size="12.5">SEO、社群、廣告、合作推薦</text>
    <line x1="300" y1="167" x2="338" y2="167" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>
  
    <rect x="348" y="92" width="264" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
    <text x="368" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">內容負責</text>
    <text x="368" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">讓他願意停下來理解你</text>
    <text x="368" y="190" class="font" fill="#52525B" font-size="12.5">真實觀點、實測證據、可落地解法</text>
    <line x1="612" y1="167" x2="650" y2="167" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>
  
