  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#18181B"/></marker></defs>
  <rect width="960" height="480" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="60" width="6" height="29.9" rx="2" fill="#EA580C"/>
  <text x="52" y="82.3" class="font" fill="#18181B" font-size="18" font-weight="800">免費內容寫很用心卻賣不動？因為「內容」跟「產品」的任務不同</text>
  
      <rect x="36" y="157.7" width="264" height="257.1" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="56" y="212.6" class="font" fill="#EA580C" font-size="12" font-weight="800">免費內容任務</text>
      <text x="56" y="267.4" class="font" fill="#18181B" font-size="16.5" font-weight="800">建立理解與信任</text>
      <text x="56" y="325.7" class="font" fill="#52525B" font-size="12.5">拆解觀念、展現思考方式，讓對的人認同你</text>
      <line x1="300" y1="286.3" x2="338" y2="286.3" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>
    
      <rect x="348" y="157.7" width="264" height="257.1" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="368" y="212.6" class="font" fill="#EA580C" font-size="12" font-weight="800">付費產品任務</text>
      <text x="368" y="267.4" class="font" fill="#18181B" font-size="16.5" font-weight="800">省時間＋交付明確結果</text>
      <text x="368" y="325.7" class="font" fill="#52525B" font-size="12.5">用模板、工具、陪跑或系統課直接解掉一個卡關</text>
      <line x1="612" y1="286.3" x2="650" y2="286.3" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>
    
      <rect x="660" y="157.7" width="264" height="257.1" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="680" y="212.6" class="font" fill="#FBBF24" font-size="12" font-weight="800">最穩起步法</text>
      <text x="680" y="267.4" class="font" fill="#FFFFFF" font-size="16.5" font-weight="800">先做小測試再完整做</text>
      <text x="680" y="325.7" class="font" fill="#D4D4D8" font-size="12.5">先賣最小版或一對一交付 3 位，驗證痛點再放大</text>
      
    
</svg>