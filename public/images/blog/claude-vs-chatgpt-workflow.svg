<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="寫提案時 Claude 與 ChatGPT 的實戰分工圖">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="480" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="58.3" width="6" height="29.9" rx="2" fill="#EA580C"/>
  <text x="52" y="79.4" class="font" fill="#18181B" font-size="18" font-weight="800">寫提案不用二選一：看任務階段挑「改稿成本最低」的那一邊</text>

  <rect x="36" y="152.3" width="430" height="271.4" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
  <rect x="56" y="182.1" width="110" height="25.3" rx="11" fill="#EA580C"/>
  <text x="111" y="206.9" text-anchor="middle" class="font" fill="#FFFFFF" font-size="11" font-weight="800">首選 Claude</text>
  <text x="56" y="264.8" class="font" fill="#18181B" font-size="16.5" font-weight="800">長文論述、提案初稿與口吻修飾</text>
  <text x="56" y="311.2" class="font" fill="#52525B" font-size="13">• 繁中語感較自然，較少官腔與「全方位賦能」空話</text>
  <text x="56" y="354.2" class="font" fill="#EA580C" font-size="13" font-weight="700">• 適合：提案正文、銷售頁、長篇專欄與邏輯順稿</text>

  <rect x="494" y="152.3" width="430" height="271.4" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
  <rect x="514" y="182.1" width="110" height="25.3" rx="11" fill="#18181B"/>
  <text x="569" y="206.9" text-anchor="middle" class="font" fill="#FFFFFF" font-size="11" font-weight="800">首選 ChatGPT</text>
  <text x="514" y="264.8" class="font" fill="#18181B" font-size="16.5" font-weight="800">即時聯網查資料、發散點子與多模態</text>
  <text x="514" y="311.2" class="font" fill="#52525B" font-size="13">• 聯網找最新動態快，生圖與語音互動整合完整</text>
  <text x="514" y="354.2" class="font" fill="#18181B" font-size="13" font-weight="700">• 適合：前期廣搜素材、快速發想 10 組切角、日常雜事</text>
</svg>