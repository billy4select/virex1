<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="《免費！》四大商業模式：表面零元，背後靠誰買單？">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">《免費！》四大商業模式：表面零元，背後靠誰買單？</text>
  
      <rect x="36" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="52" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">模式 1</text>
      <text x="52" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">直接交叉補貼</text>
      <text x="52" y="190" class="font" fill="#52525B" font-size="12.5">送刀架賣刀片、送門號綁月租</text>
    
      <rect x="266" y="92" width="198" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="282" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">模式 2</text>
      <text x="282" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">三方市場（廣告）</text>
      <text x="282" y="190" class="font" fill="#52525B" font-size="12.5">讀者免費看內容，廣告主買注意力</text>
    
      <rect x="496" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="512" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">模式 3</text>
      <text x="512" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">免費增值 Freemium</text>
      <text x="512" y="190" class="font" fill="#52525B" font-size="12.5">95% 免費試用，5% 重度付費撐起營收</text>
    
      <rect x="726" y="92" width="198" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="742" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">模式 4</text>
      <text x="742" y="156" class="font" fill="#FFFFFF" font-size="16" font-weight="800">非貨幣市場</text>
      <text x="742" y="190" class="font" fill="#D4D4D8" font-size="12.5">用內容換信任、名聲與長期品牌複利</text>
    
</svg>