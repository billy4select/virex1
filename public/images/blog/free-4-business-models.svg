<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="《免費！》四大商業模式：表面零元，背後靠誰買單？">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="520" rx="16" fill="#FFFBF5"/>
  <rect x="36" y="34" width="7" height="32" rx="2" fill="#EA580C"/>
  <text x="56" y="58" class="font" fill="#18181B" font-size="21" font-weight="800">《免費！》四大商業模式：表面零元，背後靠誰買單？</text>
  
      <rect x="36" y="108" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">模式 1</text>
      <text x="64" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">直接交叉補貼</text>
      <text x="64" y="232" class="font" fill="#52525B" font-size="15.5">送刀架賣刀片、送門號綁月租</text>

      <rect x="494" y="108" width="430" height="174" rx="14" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="522" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">模式 2</text>
      <text x="522" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">三方市場（廣告）</text>
      <text x="522" y="232" class="font" fill="#52525B" font-size="15.5">讀者免費看內容，廣告主買注意力</text>

      <rect x="36" y="306" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="346" class="font" fill="#EA580C" font-size="13.5" font-weight="800">模式 3</text>
      <text x="64" y="384" class="font" fill="#18181B" font-size="20" font-weight="800">免費增值 Freemium</text>
      <text x="64" y="430" class="font" fill="#52525B" font-size="15.5">95% 免費試用，5% 重度付費撐起營收</text>

      <rect x="494" y="306" width="430" height="174" rx="14" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="522" y="346" class="font" fill="#FBBF24" font-size="13.5" font-weight="800">模式 4</text>
      <text x="522" y="384" class="font" fill="#FFFFFF" font-size="20" font-weight="800">非貨幣市場</text>
      <text x="522" y="430" class="font" fill="#D4D4D8" font-size="15.5">用內容換信任、名聲與長期品牌複利</text>
</svg>
