<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="沒名氣也能接到第一個案子：把專業變成市場價值的 4 個步驟">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">沒名氣也能接到第一個案子：把專業變成市場價值的 4 個步驟</text>
  
      <rect x="36" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="52" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">步驟 1</text>
      <text x="52" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">盤點可證明成果</text>
      <text x="52" y="190" class="font" fill="#52525B" font-size="12.5">整理做過的專案紀錄與具體改善數字</text>
    
      <rect x="266" y="92" width="198" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="282" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">步驟 2</text>
      <text x="282" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">鎖定有人付錢的痛</text>
      <text x="282" y="190" class="font" fill="#52525B" font-size="12.5">從身邊弱連結與前同事最頭痛的事找切口</text>
    
      <rect x="496" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="512" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">步驟 3</text>
      <text x="512" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">包裝成清楚交付</text>
      <text x="512" y="190" class="font" fill="#52525B" font-size="12.5">寫清範圍、時程與具體產出，降低對方猶豫</text>
    
      <rect x="726" y="92" width="198" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="742" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">步驟 4</text>
      <text x="742" y="156" class="font" fill="#FFFFFF" font-size="16" font-weight="800">小案驗證再放大</text>
      <text x="742" y="190" class="font" fill="#D4D4D8" font-size="12.5">先穩穩交出前三個案例，靠口碑滾動下一單</text>
    
</svg>