<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="《專家機密》拆解：為什麼「賣新機會」比「賣微幅改善」好賣十倍？">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="520" rx="16" fill="#FFFBF5"/>
  <rect x="36" y="34" width="7" height="32" rx="2" fill="#EA580C"/>
  <text x="56" y="58" class="font" fill="#18181B" font-size="21" font-weight="800">《專家機密》拆解：為什麼「賣新機會」比「賣微幅改善」好賣十倍？</text>
  
      <rect x="36" y="108" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">01 定位</text>
      <text x="64" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">先走前兩步即可</text>
      <text x="64" y="232" class="font" fill="#52525B" font-size="15.5">不必是全球第一，只要能帶人走過你踩過的坑</text>

      <rect x="494" y="108" width="430" height="174" rx="14" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="522" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">02 切角</text>
      <text x="522" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">提供「新機會」</text>
      <text x="522" y="232" class="font" fill="#52525B" font-size="15.5">大家討厭更辛苦，渴望一條更省力的新路徑</text>

      <rect x="36" y="306" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="346" class="font" fill="#EA580C" font-size="13.5" font-weight="800">03 故事</text>
      <text x="64" y="384" class="font" fill="#18181B" font-size="20" font-weight="800">打破舊信念框架</text>
      <text x="64" y="430" class="font" fill="#52525B" font-size="15.5">用真實轉折讓受眾相信「這方法我也做得到」</text>

      <rect x="494" y="306" width="430" height="174" rx="14" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="522" y="346" class="font" fill="#FBBF24" font-size="13.5" font-weight="800">04 變現</text>
      <text x="522" y="384" class="font" fill="#FFFFFF" font-size="20" font-weight="800">先給價值再提方案</text>
      <text x="522" y="430" class="font" fill="#D4D4D8" font-size="15.5">用穩定內容累積信任，成交只是自然結果</text>
</svg>
