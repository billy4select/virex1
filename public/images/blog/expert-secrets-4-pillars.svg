<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="《專家機密》拆解：為什麼「賣新機會」比「賣微幅改善」好賣十倍？">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">《專家機密》拆解：為什麼「賣新機會」比「賣微幅改善」好賣十倍？</text>
  
      <rect x="36" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="52" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">01 定位</text>
      <text x="52" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">先走前兩步即可</text>
      <text x="52" y="190" class="font" fill="#52525B" font-size="12.5">不必是全球第一，只要能帶人走過你踩過的坑</text>
    
      <rect x="266" y="92" width="198" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="282" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">02 切角</text>
      <text x="282" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">提供「新機會」</text>
      <text x="282" y="190" class="font" fill="#52525B" font-size="12.5">大家討厭更辛苦，渴望一條更省力的新路徑</text>
    
      <rect x="496" y="92" width="198" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="512" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">03 故事</text>
      <text x="512" y="156" class="font" fill="#18181B" font-size="16" font-weight="800">打破舊信念框架</text>
      <text x="512" y="190" class="font" fill="#52525B" font-size="12.5">用真實轉折讓受眾相信「這方法我也做得到」</text>
    
      <rect x="726" y="92" width="198" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="742" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">04 變現</text>
      <text x="742" y="156" class="font" fill="#FFFFFF" font-size="16" font-weight="800">先給價值再提方案</text>
      <text x="742" y="190" class="font" fill="#D4D4D8" font-size="12.5">用穩定內容累積信任，成交只是自然結果</text>
    
</svg>