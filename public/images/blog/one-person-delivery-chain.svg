<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="一人公司五大角色與六節點最小交付鏈圖">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#18181B"/></marker></defs>
  <rect width="960" height="330" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">一人公司不是「一個人扛所有事」，而是把角色與交付節點切乾淨</text>

  <!-- Row 1: 5 Roles -->
  
    <rect x="36" y="86" width="160" height="82" rx="10" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
    <text x="50" y="116" class="font" fill="#18181B" font-size="14.5" font-weight="800">1. 業務角色</text>
    <text x="50" y="142" class="font" fill="#52525B" font-size="12" font-weight="400">名單・對話・篩選</text>
  
    <rect x="218" y="86" width="160" height="82" rx="10" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
    <text x="232" y="116" class="font" fill="#18181B" font-size="14.5" font-weight="800">2. 專案角色</text>
    <text x="232" y="142" class="font" fill="#52525B" font-size="12" font-weight="400">範圍・報價・邊界</text>
  
    <rect x="400" y="86" width="160" height="82" rx="10" fill="#FFF3EB" stroke="#EA580C" stroke-width="2"/>
    <text x="414" y="116" class="font" fill="#18181B" font-size="14.5" font-weight="800">3. 研究角色</text>
    <text x="414" y="142" class="font" fill="#EA580C" font-size="12" font-weight="700">AI 蒐集・人工查證</text>
  
    <rect x="582" y="86" width="160" height="82" rx="10" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
    <text x="596" y="116" class="font" fill="#18181B" font-size="14.5" font-weight="800">4. 執行角色</text>
    <text x="596" y="142" class="font" fill="#52525B" font-size="12" font-weight="400">AI 初稿・人工改寫</text>
  
    <rect x="764" y="86" width="160" height="82" rx="10" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
    <text x="778" y="116" class="font" fill="#18181B" font-size="14.5" font-weight="800">5. 品管角色</text>
    <text x="778" y="142" class="font" fill="#52525B" font-size="12" font-weight="400">事實・邏輯・負全責</text>
  

  <!-- Row 2: 6-node Delivery Chain -->
  <rect x="36" y="196" width="888" height="102" rx="12" fill="#18181B"/>
  <text x="56" y="224" class="font" fill="#FBBF24" font-size="13" font-weight="800">一條最小交付鏈（每個節點都先寫清楚「完成定義」，避免無限修改）</text>
  
      <rect x="56" y="240" width="126" height="40" rx="8" fill="#27272A" stroke="#52525B" stroke-width="1.5"/>
      <text x="119" y="265" text-anchor="middle" class="font" fill="#FFFFFF" font-size="13" font-weight="700">1 需求確認</text>
    
      <rect x="200" y="240" width="126" height="40" rx="8" fill="#27272A" stroke="#52525B" stroke-width="1.5"/>
      <text x="263" y="265" text-anchor="middle" class="font" fill="#FFFFFF" font-size="13" font-weight="700">2 資料收集</text>
    
      <rect x="344" y="240" width="126" height="40" rx="8" fill="#27272A" stroke="#52525B" stroke-width="1.5"/>
      <text x="407" y="265" text-anchor="middle" class="font" fill="#FFFFFF" font-size="13" font-weight="700">3 架構提案</text>
    
      <rect x="488" y="240" width="126" height="40" rx="8" fill="#27272A" stroke="#52525B" stroke-width="1.5"/>
      <text x="551" y="265" text-anchor="middle" class="font" fill="#FFFFFF" font-size="13" font-weight="700">4 初版產出</text>
    
      <rect x="632" y="240" width="126" height="40" rx="8" fill="#EA580C" stroke="#EA580C" stroke-width="1.5"/>
      <text x="695" y="265" text-anchor="middle" class="font" fill="#FFFFFF" font-size="13" font-weight="700">5 品管檢查</text>
    
      <rect x="776" y="240" width="126" height="40" rx="8" fill="#27272A" stroke="#52525B" stroke-width="1.5"/>
      <text x="839" y="265" text-anchor="middle" class="font" fill="#FFFFFF" font-size="13" font-weight="700">6 交付回饋</text>
    
</svg>