<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="離開名片後還剩什麼？中階主管務必提早累積的 5 項可攜帶資產">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="300" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">離開名片後還剩什麼？中階主管務必提早累積的 5 項可攜帶資產</text>
  
      <rect x="36" y="82" width="888" height="34" rx="8" fill="#FFF3EB" stroke="#EA580C" stroke-width="1.8"/>
      <rect x="48" y="88" width="38" height="22" rx="6" fill="#EA580C"/>
      <text x="67" y="103" text-anchor="middle" class="font" fill="#FFFFFF" font-size="11.5" font-weight="800">01</text>
      <text x="102" y="104" class="font" fill="#18181B" font-size="13.5" font-weight="800">可複製的方法論</text>
      <text x="320" y="104" class="font" fill="#EA580C" font-size="13" font-weight="700">把做事套路寫成 SOP 與框架，換環境照樣能打</text>
    
      <rect x="36" y="124" width="888" height="34" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.8"/>
      <rect x="48" y="130" width="38" height="22" rx="6" fill="#18181B"/>
      <text x="67" y="145" text-anchor="middle" class="font" fill="#FFFFFF" font-size="11.5" font-weight="800">02</text>
      <text x="102" y="146" class="font" fill="#18181B" font-size="13.5" font-weight="800">跨組織的專業信任</text>
      <text x="320" y="146" class="font" fill="#52525B" font-size="13" font-weight="400">合作夥伴、客戶與前同事對你個人口碑的認可</text>
    
      <rect x="36" y="166" width="888" height="34" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.8"/>
      <rect x="48" y="172" width="38" height="22" rx="6" fill="#18181B"/>
      <text x="67" y="187" text-anchor="middle" class="font" fill="#FFFFFF" font-size="11.5" font-weight="800">03</text>
      <text x="102" y="188" class="font" fill="#18181B" font-size="13.5" font-weight="800">公開可查的成果作品</text>
      <text x="320" y="188" class="font" fill="#52525B" font-size="13" font-weight="400">文章、案例拆解、工具或專案紀錄，不用只靠口說</text>
    
      <rect x="36" y="208" width="888" height="34" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.8"/>
      <rect x="48" y="214" width="38" height="22" rx="6" fill="#18181B"/>
      <text x="67" y="229" text-anchor="middle" class="font" fill="#FFFFFF" font-size="11.5" font-weight="800">04</text>
      <text x="102" y="230" class="font" fill="#18181B" font-size="13.5" font-weight="800">外部同業人脈網</text>
      <text x="320" y="230" class="font" fill="#52525B" font-size="13" font-weight="400">不只待在公司內部群組，保持與外部市場的資訊連結</text>
    
      <rect x="36" y="250" width="888" height="34" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.8"/>
      <rect x="48" y="256" width="38" height="22" rx="6" fill="#18181B"/>
      <text x="67" y="271" text-anchor="middle" class="font" fill="#FFFFFF" font-size="11.5" font-weight="800">05</text>
      <text x="102" y="272" class="font" fill="#18181B" font-size="13.5" font-weight="800">問題定義與判斷力</text>
      <text x="320" y="272" class="font" fill="#52525B" font-size="13" font-weight="400">在資訊不全時能抓出優先順序、扛起決策責任</text>
    
</svg>