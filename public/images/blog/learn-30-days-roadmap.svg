<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="30 天用 AI 切入陌生領域：目標不是當專家，而是交出一個小型成果">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="520" rx="16" fill="#FFFBF5"/>
  <rect x="36" y="34" width="7" height="32" rx="2" fill="#EA580C"/>
  <text x="56" y="58" class="font" fill="#18181B" font-size="21" font-weight="800">30 天用 AI 切入陌生領域：目標不是當專家，而是交出一個小型成果</text>
  
      <rect x="36" y="108" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">第 1 週</text>
      <text x="64" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">畫出問題地圖</text>
      <text x="64" y="232" class="font" fill="#52525B" font-size="15.5">搞懂核心名詞、流派與關鍵問題</text>

      <rect x="494" y="108" width="430" height="174" rx="14" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="522" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">第 2 週</text>
      <text x="522" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">用提問測理解</text>
      <text x="522" y="232" class="font" fill="#52525B" font-size="15.5">用白話講一遍，請 AI 挑出盲點</text>

      <rect x="36" y="306" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="346" class="font" fill="#EA580C" font-size="13.5" font-weight="800">第 3 週</text>
      <text x="64" y="384" class="font" fill="#18181B" font-size="20" font-weight="800">做出小型實作</text>
      <text x="64" y="430" class="font" fill="#52525B" font-size="15.5">實際跑一個最小專案暴露真卡點</text>

      <rect x="494" y="306" width="430" height="174" rx="14" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="522" y="346" class="font" fill="#FBBF24" font-size="13.5" font-weight="800">第 4 週</text>
      <text x="522" y="384" class="font" fill="#FFFFFF" font-size="20" font-weight="800">檢討與補洞</text>
      <text x="522" y="430" class="font" fill="#D4D4D8" font-size="15.5">整理踩雷筆記，明確下一步方向</text>
</svg>
