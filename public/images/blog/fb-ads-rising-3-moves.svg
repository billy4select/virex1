<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="因應 FB Meta 廣告費變貴的三個實戰動作">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="280" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="28" width="6" height="26" rx="2" fill="#EA580C"/>
  <text x="52" y="48" class="font" fill="#18181B" font-size="18" font-weight="800">廣告費不會變回從前：與其抱怨變貴，先把這 3 件事做扎實</text>
  
    <rect x="36" y="92" width="264" height="150" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
    <text x="56" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">動作 1</text>
    <text x="56" y="156" class="font" fill="#18181B" font-size="16.5" font-weight="800">把單筆客單價拉高</text>
    <text x="56" y="190" class="font" fill="#52525B" font-size="12.5">用組合包與加價購擴大毛利緩衝空間</text>
  
    <rect x="348" y="92" width="264" height="150" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
    <text x="368" y="124" class="font" fill="#EA580C" font-size="12" font-weight="800">動作 2</text>
    <text x="368" y="156" class="font" fill="#18181B" font-size="16.5" font-weight="800">建立免費自有入口</text>
    <text x="368" y="190" class="font" fill="#52525B" font-size="12.5">佈局 SEO 長文與電子報，降低對單一廣告依賴</text>
  
    <rect x="660" y="92" width="264" height="150" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
    <text x="680" y="124" class="font" fill="#FBBF24" font-size="12" font-weight="800">動作 3</text>
    <text x="680" y="156" class="font" fill="#FFFFFF" font-size="16.5" font-weight="800">專攻高回購與轉介紹</text>
    <text x="680" y="190" class="font" fill="#D4D4D8" font-size="12.5">把第一單的獲客成本攤提在老客終身價值上</text>
  
</svg>