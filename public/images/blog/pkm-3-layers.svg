<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="個人知識管理不用搞複雜工具：回到「收集 → 理解 → 輸出」三層就夠">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#18181B"/></marker></defs>
  <rect width="960" height="480" rx="14" fill="#FFFBF5"/>
  <rect x="36" y="60" width="6" height="29.9" rx="2" fill="#EA580C"/>
  <text x="52" y="82.3" class="font" fill="#18181B" font-size="18" font-weight="800">個人知識管理不用搞複雜工具：回到「收集 → 理解 → 輸出」三層就夠</text>
  
      <rect x="36" y="157.7" width="264" height="257.1" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="56" y="212.6" class="font" fill="#EA580C" font-size="12" font-weight="800">第 1 層：收集</text>
      <text x="56" y="267.4" class="font" fill="#18181B" font-size="16.5" font-weight="800">只存未來用得到的</text>
      <text x="56" y="325.7" class="font" fill="#52525B" font-size="12.5">不當數位倉鼠，沒明確用途的連結直接放過</text>
      <line x1="300" y1="286.3" x2="338" y2="286.3" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>
    
      <rect x="348" y="157.7" width="264" height="257.1" rx="12" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="368" y="212.6" class="font" fill="#EA580C" font-size="12" font-weight="800">第 2 層：理解</text>
      <text x="368" y="267.4" class="font" fill="#18181B" font-size="16.5" font-weight="800">用自己的話重寫一遍</text>
      <text x="368" y="325.7" class="font" fill="#52525B" font-size="12.5">沒改寫的剪貼還是別人的，每週花 30 分鐘整理</text>
      <line x1="612" y1="286.3" x2="650" y2="286.3" stroke="#18181B" stroke-width="2" marker-end="url(#a)"/>
    
      <rect x="660" y="157.7" width="264" height="257.1" rx="12" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="680" y="212.6" class="font" fill="#FBBF24" font-size="12" font-weight="800">第 3 層：輸出</text>
      <text x="680" y="267.4" class="font" fill="#FFFFFF" font-size="16.5" font-weight="800">變成文章、簡報或 SOP</text>
      <text x="680" y="325.7" class="font" fill="#D4D4D8" font-size="12.5">沒有輸出的知識庫只是收藏夾，輸出才是驗收</text>
      
    
</svg>