<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="說服不是靠形容詞堆疊：讓文章站得住腳的 4 個關鍵元件">
  <defs><style>.font{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}</style></defs>
  <rect width="960" height="520" rx="16" fill="#FFFBF5"/>
  <rect x="36" y="34" width="7" height="32" rx="2" fill="#EA580C"/>
  <text x="56" y="58" class="font" fill="#18181B" font-size="21" font-weight="800">說服不是靠形容詞堆疊：讓文章站得住腳的 4 個關鍵元件</text>
  
      <rect x="36" y="108" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">關鍵 1</text>
      <text x="64" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">先讓自己買單</text>
      <text x="64" y="232" class="font" fill="#52525B" font-size="15.5">自己讀了都心虛的論點，讀者一眼就看穿</text>

      <rect x="494" y="108" width="430" height="174" rx="14" fill="#FFF3EB" stroke="#EA580C" stroke-width="2.2"/>
      <text x="522" y="148" class="font" fill="#EA580C" font-size="13.5" font-weight="800">關鍵 2</text>
      <text x="522" y="186" class="font" fill="#18181B" font-size="20" font-weight="800">具體對照畫面</text>
      <text x="522" y="232" class="font" fill="#52525B" font-size="15.5">用前後差異與數字取代「很有效、很棒」</text>

      <rect x="36" y="306" width="430" height="174" rx="14" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
      <text x="64" y="346" class="font" fill="#EA580C" font-size="13.5" font-weight="800">關鍵 3</text>
      <text x="64" y="384" class="font" fill="#18181B" font-size="20" font-weight="800">誠實講出代價</text>
      <text x="64" y="430" class="font" fill="#52525B" font-size="15.5">主動點出限制與不適用對象，信任感翻倍</text>

      <rect x="494" y="306" width="430" height="174" rx="14" fill="#18181B" stroke="#18181B" stroke-width="2.2"/>
      <text x="522" y="346" class="font" fill="#FBBF24" font-size="13.5" font-weight="800">關鍵 4</text>
      <text x="522" y="384" class="font" fill="#FFFFFF" font-size="20" font-weight="800">可驗證下一步</text>
      <text x="522" y="430" class="font" fill="#D4D4D8" font-size="15.5">給一個讀者今天就能自己驗證的小動作</text>
</svg>
